name: "CodeQL config"
packs:
  javascript:
    - opengovsg/nextjs-custom-queries@1.0.1
    - opengovsg/react-custom-queries@1.0.1
query-filters:
  - exclude:
      id: js/hardcoded-credentials
  - exclude:
      id: js/missing-rate-limiting
  - exclude:
      id: js/missing-token-validation
  - exclude:
      id: actions/missing-workflow-permissions
paths-ignore:
  - '**/test/**'
  - '**/tests/**'
  - '**/__test__/**'
  - '**/__tests__/**'
  - '**/*.test.*'
