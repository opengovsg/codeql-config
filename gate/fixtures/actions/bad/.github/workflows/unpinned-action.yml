# Deployment-gate known-bad fixture (dormant until codeql-config.yml gains an
# actions: packs key). Nested under the fixture dir so the CodeQL actions
# extractor sees it via --source-root while GitHub never runs it (only the repo
# root's .github/workflows/ executes). A mutable @v4 tag on a third-party action
# is flagged as actions/unpinned-tag.
name: gate-fixture-unpinned
on: push
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
